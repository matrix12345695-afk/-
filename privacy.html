<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InvoiceGuard — Privacy & Security</title><link rel="stylesheet" href="styles.css"><style>.privacy{max-width:820px;padding:56px 24px 80px}.privacy h1{margin-bottom:12px}.privacy h2{margin-top:32px}.privacy p{line-height:1.7}.privacy-nav{display:flex;align-items:center;justify-content:space-between;gap:16px}.privacy-nav a{font-weight:700}</style></head><body><header class="wrap nav privacy-nav"><strong>InvoiceGuard</strong><a href="index.html" id="back">Back to audit</a></header><main class="wrap privacy" id="content"></main><script>
const copy={
en:{title:"Privacy & Security",current:"Current MVP",p1:"InvoiceGuard currently processes uploaded CSV files in your browser. The CSV audit does not require a cloud upload or account.",p2:"Your browser may keep audit rules and a limited invoice history in localStorage so repeated vendor and invoice-number combinations can be detected across audits. You can remove invoice history with the Clear local history control or clear site data in your browser.",p3:"Findings and normalized CSV exports are generated in your browser and downloaded to your device.",boundaries:"Important boundaries",p4:"InvoiceGuard findings are decision support and should be reviewed before payment. Only process files you are authorized to access.",p5:"Future PDF or image processing must document its real processing and retention model before it is marketed as private. Before commercial launch, the deployed product should publish a privacy policy that matches its actual architecture and provide a real support contact.",back:"Back to audit"},
ru:{title:"Конфиденциальность и безопасность",current:"Текущая MVP-версия",p1:"InvoiceGuard обрабатывает загруженные CSV-файлы в вашем браузере. Для проверки CSV не требуется загрузка в облако или учётная запись.",p2:"Браузер может хранить правила проверки и ограниченную историю счетов в localStorage, чтобы находить повторяющиеся сочетания поставщика и номера счёта между проверками. Историю можно удалить кнопкой «Очистить локальную историю» или очистив данные сайта в браузере.",p3:"Результаты проверки и нормализованные CSV-файлы создаются в браузере и скачиваются на ваше устройство.",boundaries:"Важные ограничения",p4:"Результаты InvoiceGuard помогают принимать решения и должны быть проверены до оплаты. Обрабатывайте только файлы, к которым у вас есть законный доступ.",p5:"Для будущей обработки PDF или изображений реальная модель обработки и хранения должна быть задокументирована до заявлений о конфиденциальности. Перед коммерческим запуском опубликованная политика должна соответствовать фактической архитектуре и содержать реальный контакт поддержки.",back:"Вернуться к проверке"},
uz:{title:"Maxfiylik va xavfsizlik",current:"Joriy MVP",p1:"InvoiceGuard yuklangan CSV fayllarni brauzeringizda qayta ishlaydi. CSV auditi uchun bulutga yuklash yoki hisob talab qilinmaydi.",p2:"Brauzer audit qoidalari va cheklangan hisob-faktura tarixini localStorage’da saqlashi mumkin, shunda takroriy yetkazib beruvchi va hisob raqami juftliklari auditlar orasida aniqlanadi. Tarixni «Lokal tarixni tozalash» boshqaruvi yoki brauzerdagi sayt ma’lumotlarini tozalash orqali o‘chirishingiz mumkin.",p3:"Topilmalar va normallashtirilgan CSV eksportlari brauzeringizda yaratiladi va qurilmangizga yuklab olinadi.",boundaries:"Muhim chegaralar",p4:"InvoiceGuard topilmalari qaror qabul qilishga yordam beradi va to‘lovdan oldin tekshirilishi kerak. Faqat kirish huquqingiz bo‘lgan fayllarni qayta ishlang.",p5:"Kelajakdagi PDF yoki rasm qayta ishlashi maxfiy deb taqdim etilishidan oldin haqiqiy qayta ishlash va saqlash modeli hujjatlashtirilishi kerak. Tijoriy ishga tushirishdan oldin e’lon qilingan maxfiylik siyosati haqiqiy arxitekturaga mos bo‘lishi va real qo‘llab-quvvatlash kontaktini taqdim etishi kerak.",back:"Auditga qaytish"},
es:{title:"Privacidad y seguridad",current:"MVP actual",p1:"InvoiceGuard procesa actualmente los archivos CSV cargados en tu navegador. La auditoría CSV no requiere subir archivos a la nube ni crear una cuenta.",p2:"El navegador puede guardar las reglas de auditoría y un historial limitado de facturas en localStorage para detectar combinaciones repetidas de proveedor y número de factura entre auditorías. Puedes eliminar el historial con el control «Borrar historial local» o borrando los datos del sitio en el navegador.",p3:"Los hallazgos y las exportaciones CSV normalizadas se generan en tu navegador y se descargan en tu dispositivo.",boundaries:"Límites importantes",p4:"Los hallazgos de InvoiceGuard son apoyo para la toma de decisiones y deben revisarse antes del pago. Procesa únicamente archivos a los que estés autorizado a acceder.",p5:"Cualquier procesamiento futuro de PDF o imágenes deberá documentar su modelo real de procesamiento y retención antes de presentarse como privado. Antes del lanzamiento comercial, la política publicada deberá reflejar la arquitectura real y ofrecer un contacto de soporte válido.",back:"Volver a la auditoría"},
de:{title:"Datenschutz & Sicherheit",current:"Aktuelles MVP",p1:"InvoiceGuard verarbeitet hochgeladene CSV-Dateien derzeit in Ihrem Browser. Für die CSV-Prüfung sind weder ein Cloud-Upload noch ein Konto erforderlich.",p2:"Der Browser kann Prüfregeln und einen begrenzten Rechnungsverlauf in localStorage speichern, damit wiederkehrende Kombinationen aus Lieferant und Rechnungsnummer über Prüfungen hinweg erkannt werden. Sie können den Verlauf über «Lokalen Verlauf löschen» oder durch Löschen der Website-Daten im Browser entfernen.",p3:"Prüfergebnisse und normalisierte CSV-Exporte werden in Ihrem Browser erstellt und auf Ihr Gerät heruntergeladen.",boundaries:"Wichtige Grenzen",p4:"InvoiceGuard-Ergebnisse dienen als Entscheidungshilfe und sollten vor der Zahlung geprüft werden. Verarbeiten Sie nur Dateien, auf die Sie zugreifen dürfen.",p5:"Eine zukünftige PDF- oder Bildverarbeitung muss ihr tatsächliches Verarbeitungs- und Aufbewahrungsmodell dokumentieren, bevor sie als privat beworben wird. Vor dem kommerziellen Start muss die veröffentlichte Datenschutzrichtlinie der tatsächlichen Architektur entsprechen und einen echten Supportkontakt enthalten.",back:"Zurück zur Prüfung"},
fr:{title:"Confidentialité et sécurité",current:"MVP actuel",p1:"InvoiceGuard traite actuellement les fichiers CSV importés dans votre navigateur. L’audit CSV ne nécessite ni envoi dans le cloud ni compte.",p2:"Le navigateur peut conserver les règles d’audit et un historique limité des factures dans localStorage afin de détecter les combinaisons répétées fournisseur-numéro de facture entre les audits. Vous pouvez supprimer cet historique avec la commande «Effacer l’historique local» ou en effaçant les données du site dans votre navigateur.",p3:"Les constats et les exports CSV normalisés sont générés dans votre navigateur et téléchargés sur votre appareil.",boundaries:"Limites importantes",p4:"Les constats d’InvoiceGuard constituent une aide à la décision et doivent être vérifiés avant paiement. Ne traitez que les fichiers auxquels vous êtes autorisé à accéder.",p5:"Tout futur traitement de PDF ou d’images devra documenter son modèle réel de traitement et de conservation avant d’être présenté comme privé. Avant le lancement commercial, la politique publiée devra correspondre à l’architecture réelle et fournir un véritable contact d’assistance.",back:"Retour à l’audit"},
pt:{title:"Privacidade e segurança",current:"MVP atual",p1:"O InvoiceGuard processa atualmente os arquivos CSV enviados no seu navegador. A auditoria de CSV não exige envio para a nuvem nem uma conta.",p2:"O navegador pode manter regras de auditoria e um histórico limitado de faturas no localStorage para detectar combinações repetidas de fornecedor e número de fatura entre auditorias. Você pode remover o histórico com o controle «Limpar histórico local» ou limpando os dados do site no navegador.",p3:"As constatações e exportações CSV normalizadas são geradas no navegador e baixadas para o seu dispositivo.",boundaries:"Limites importantes",p4:"As constatações do InvoiceGuard servem como apoio à decisão e devem ser revisadas antes do pagamento. Processe apenas arquivos aos quais você tem autorização de acesso.",p5:"Qualquer processamento futuro de PDF ou imagens deverá documentar seu modelo real de processamento e retenção antes de ser divulgado como privado. Antes do lançamento comercial, a política publicada deverá corresponder à arquitetura real e fornecer um contato de suporte válido.",back:"Voltar à auditoria"}}
const saved=localStorage.getItem("invoiceguard_lang");const l=copy[saved]?saved:"en",t=copy[l];document.documentElement.lang=l;document.title=`InvoiceGuard — ${t.title}`;document.getElementById("back").textContent=t.back;document.getElementById("content").innerHTML=`<h1>${t.title}</h1><h2>${t.current}</h2><p>${t.p1}</p><p>${t.p2}</p><p>${t.p3}</p><h2>${t.boundaries}</h2><p>${t.p4}</p><p>${t.p5}</p>`;
</script></body></html>
