name: InvoiceGuard public preview browser smoke

on:
  pull_request:
    paths:
      - ".github/workflows/public-preview-browser-smoke.yml"
      - "tests/public-preview-browser-smoke.mjs"
      - "index.html"
      - "app.js"
      - "clean-export.js"
      - "clean-export-live.js"
      - "findings-export-i18n.js"
      - "csv-live.js"
      - "number-core.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: invoiceguard-public-preview-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-preview-smoke:
    name: Public Floot preview upload and export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INVOICEGUARD_PUBLIC_URL: https://invoiceguard.floot.app
    steps:
      - name: Check out tested revision
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise public preview with synthetic data
        run: node tests/public-preview-browser-smoke.mjs
