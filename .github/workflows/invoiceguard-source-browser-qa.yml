name: InvoiceGuard source and hosted browser QA

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'clean-export.js'
      - 'clean-export-live.js'
      - 'download-utils.js'
      - 'findings-export-i18n.js'
      - 'summary-i18n.js'
      - 'tests/source-browser-acceptance.mjs'
      - 'tests/hosted-floot-browser-acceptance.mjs'
      - '.github/workflows/invoiceguard-source-browser-qa.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'clean-export.js'
      - 'clean-export-live.js'
      - 'download-utils.js'
      - 'findings-export-i18n.js'
      - 'summary-i18n.js'
      - 'tests/source-browser-acceptance.mjs'
      - 'tests/hosted-floot-browser-acceptance.mjs'
      - '.github/workflows/invoiceguard-source-browser-qa.yml'

permissions:
  contents: read

jobs:
  local-source-browser:
    name: Source and hosted upload/export acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Start local static preview
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/invoiceguard-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then
              echo "Local InvoiceGuard preview is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/invoiceguard-preview.log
          exit 1
      - name: Test upload, safe exports and privacy on the GitHub source
        env:
          INVOICEGUARD_SOURCE_URL: http://127.0.0.1:8765/
        run: node tests/source-browser-acceptance.mjs
      - name: Test the published Floot build, four exports and privacy
        env:
          INVOICEGUARD_HOSTED_URL: https://invoiceguard.floot.app/
        run: node tests/hosted-floot-browser-acceptance.mjs
